[game]
title = "Killzone 2"
title_id = "BCUS98116"
disc_id = "BCUS98116"
version = "01.01"
category = "HG"

[paths]
game_dump = "game_dump"
eboot_bin = "game_dump/PS3_GAME/USRDIR/EBOOT.BIN"
eboot_elf = "game_dump/PS3_GAME/USRDIR/EBOOT.ELF"
psarc_archive = "game_dump/PS3_GAME/USRDIR/data_ps3.psarc"

[memory]
main_ram_mb = 256
rsx_vram_mb = 256
enable_bounds_checking = true

[cell]
ppu_threads = 2
spu_threads = 6
spu_loop_optimization = true

[graphics]
backend = "Vulkan"
resolution_scale = 1.0
vsync = true
async_shaders = true

[audio]
backend = "SDL"
sample_rate = 48000
